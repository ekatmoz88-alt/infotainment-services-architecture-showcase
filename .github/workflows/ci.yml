name: Infotainment CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run markdown security linter
        run: |
          python - <<'PYEOF'
          import re, pathlib, sys

          docs_dir = pathlib.Path('docs')
          md_files = list(docs_dir.rglob('*.md'))

          # Mermaid block check
          mermaid_open = r'```mermaid'
          mermaid_close = r'```'
          for md_path in md_files:
              text = md_path.read_text(encoding='utf-8', errors='replace')
              opens = len(re.findall(mermaid_open, text))
              closes = len(re.findall(mermaid_close, text))
              if opens != closes:
                  print(f'{md_path}: mermaid block mismatch (opens={opens}, closes={closes})')
                  sys.exit(1)

          # Corporate email check
          email_re = r'@luxoft|@zodiac'
          for md_path in md_files:
              text = md_path.read_text(encoding='utf-8', errors='replace')
              if re.search(email_re, text):
                  print(f'{md_path}: contains prohibited corporate email')
                  sys.exit(1)

          # Local path check
          local_path_re = r'/media/[^\s]+'
          for md_path in md_files:
              text = md_path.read_text(encoding='utf-8', errors='replace')
              if re.search(local_path_re, text):
                  print(f'{md_path}: contains local path /media/')
                  sys.exit(1)

          print('All Markdown files passed the security checks.')
          PYEOF