name: Infotainment CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Markdown fenced code blocks
        run: |
          python - <<'PYEOF'
          import re, pathlib, sys

          base = pathlib.Path('.')
          md_files = list(base.rglob('*.md'))

          errors = []

          # Count fenced code blocks (```) per file; total must be even
          for p in md_files:
              txt = p.read_text(encoding='utf-8', errors='replace')
              # count lines that start with ``` (optionally preceded by up to 3 spaces)
              fences = len(re.findall(r'^( {0,3})```', txt, flags=re.M))
              if fences % 2 != 0:
                  errors.append(f'{p}: unbalanced code fences (count={fences})')

          # Disallowed email addresses
          for p in md_files:
              txt = p.read_text(encoding='utf-8', errors='replace')
              if re.search(r'@luxoft|@zodiac', txt):
                  errors.append(f'{p}: contains prohibited corporate email')

          # Disallowed local paths
          for p in md_files:
              txt = p.read_text(encoding='utf-8', errors='replace')
              if '/media/' in txt or '/home/' in txt:
                  errors.append(f'{p}: contains local path /media/ or /home/')

          if errors:
              for e in errors:
                  print('ERROR:', e)
              sys.exit(1)
          else:
              print(f'Successfully validated {len(md_files)} Markdown files.')
              sys.exit(0)
          PYEOF